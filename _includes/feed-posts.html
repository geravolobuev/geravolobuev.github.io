        <ul class="ul-links">
                <p class="ul-links__p" data-reveal><span class="emoji emoji--write">✍🏻</span> notes</p>
        {% for post in site.posts %}
        {% if post.title and post.title != empty %}
                <li data-reveal>– <a class="post-link local-link link" data-ui-sound="note" data-note-link
                   href="{{ post.url }}">{{ post.title}}
                        </a></li>
        {% endif %}
        {% endfor %}
        </ul>
