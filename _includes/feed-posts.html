        <ul class="ul-links">
                <p class="ul-links__p"><span class="emoji emoji--write">✍🏻</span> notes</p>
        {% for post in site.posts %}
        {% if post.title and post.title != empty %}
                <li>– <a class="post-link local-link link" 
                   href="{{ post.url }}">{{ post.title}}
                        </a></li>
        {% endif %}
        {% endfor %}
        </ul>
